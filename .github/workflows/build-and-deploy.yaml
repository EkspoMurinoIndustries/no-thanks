name: NoThanks
env:
  SERVICE_PROFILE: no-thanks-low-memory.service
on:
  workflow_dispatch:
  push:
    branches:
      - master
jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: gradle
      - name: Setup ssh keys
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.GITHUBBOT_PRIVATE_KEY }} 
          known_hosts: unnecessary

      - name: Setup gradle
        uses: gradle/gradle-build-action@v2
      - name: Build with gradle
        run: ./gradlew build --no-daemon
      - name: Transfer selected service profile to deployment
        uses: burnett01/rsync-deployments@5.2.1
        with:
          switches: -avzr
          path: ./deploy/${{ env.SERVICE_PROFILE }}
          remote_path: /opt/apps/
          remote_host: ${{ secrets.GITHUBBOT_SSH_HOST }}
          remote_user: ${{ secrets.GITHUBBOT_USER }}
          remote_key: ${{ secrets.GITHUBBOT_PRIVATE_KEY }}
      - name: Verify selected service profile
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.GITHUBBOT_SSH_HOST }}
          username: ${{ secrets.GITHUBBOT_USER }}
          key: ${{ secrets.GITHUBBOT_PRIVATE_KEY }}
          script: |
            set -eu
            if ! cmp -s /opt/apps/${{ env.SERVICE_PROFILE }} /etc/systemd/system/no-thanks.service; then
              echo 'Installed no-thanks.service does not match deploy/${{ env.SERVICE_PROFILE }}.' >&2
              echo 'Install /opt/apps/${{ env.SERVICE_PROFILE }} as root before deploying.' >&2
              exit 1
            fi
      - name: Transfer application archive to deployment
        uses: burnett01/rsync-deployments@5.2.1
        with:
          switches: -avzr
          path: ./build/libs/no-thanks.jar
          remote_path: /opt/apps/
          remote_host: ${{ secrets.GITHUBBOT_SSH_HOST }}
          remote_user: ${{ secrets.GITHUBBOT_USER }}
          remote_key: ${{ secrets.GITHUBBOT_PRIVATE_KEY }}
      - name: Deploy new version
        uses: appleboy/ssh-action@v0.1.6
        with:
          host: ${{ secrets.GITHUBBOT_SSH_HOST }}
          username: ${{ secrets.GITHUBBOT_USER }}
          key: ${{ secrets.GITHUBBOT_PRIVATE_KEY }}
          script: |
            set -eu
            sudo -n /bin/systemctl restart no-thanks
